<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <style>
    .h{font-size:13px;font-weight:700;fill:#6e7681;letter-spacing:.08em}
    .t{font-size:12.5px;font-weight:600;fill:#fff}
    .ts{font-size:10.5px;fill:#fff;opacity:.82}
    .nt{font-size:11.5px;font-weight:600;fill:#24292f}
    .ns{font-size:10px;fill:#656d76}
    .pill-t{font-size:9.5px;font-weight:600}
    @media(prefers-color-scheme:dark){
      .h{fill:#8b949e}
      .nt{fill:#e6edf3}
      .ns{fill:#8b949e}
      .card{fill:#161b22;stroke:#30363d}
      .node{fill:#21262d;stroke:#30363d}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" class="h" style="letter-spacing:.14em">ARCHITECTURE</text>

  <!-- ═══ Input ═══ -->
  <rect x="175" y="44" width="470" height="38" rx="10" fill="#6639a6"/>
  <text x="410" y="62" text-anchor="middle" class="t" style="font-size:13px">Multi-Source Deal Data</text>
  <text x="410" y="75" text-anchor="middle" class="ts" style="font-size:9.5px">deals · counterparties · documents · comms · notes · stage events · workflows</text>

  <!-- Arrow -->
  <line x1="410" y1="82" x2="410" y2="102" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ═══ A: Standardization ═══ -->
  <rect class="card" x="80" y="106" width="660" height="62" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
  <text x="98" y="124" class="h" style="font-size:11px;fill:#6639a6">A</text>
  <text x="114" y="124" class="h" style="font-size:10px">STANDARDIZATION &amp; CONTEXT</text>
  <rect class="node" x="98" y="132" width="190" height="28" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".8"/>
  <text x="193" y="148" text-anchor="middle" class="nt">Schema Validation</text>
  <text x="193" y="158" text-anchor="middle" class="ns" style="font-size:9px">Pydantic typed models</text>
  <rect class="node" x="300" y="132" width="190" height="28" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".8"/>
  <text x="395" y="148" text-anchor="middle" class="nt">Entity Parsing</text>
  <text x="395" y="158" text-anchor="middle" class="ns" style="font-size:9px">JSON → typed objects</text>
  <rect class="node" x="502" y="132" width="222" height="28" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".8"/>
  <text x="613" y="148" text-anchor="middle" class="nt">Deal Context Assembly</text>
  <text x="613" y="158" text-anchor="middle" class="ns" style="font-size:9px">join all sources per deal_id</text>

  <!-- Arrow -->
  <line x1="410" y1="168" x2="410" y2="188" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ═══ Orchestrator ═══ -->
  <rect x="245" y="192" width="330" height="38" rx="10" fill="#6639a6"/>
  <text x="410" y="210" text-anchor="middle" class="t" style="font-size:12.5px">Analysis Orchestrator</text>
  <text x="410" y="223" text-anchor="middle" class="ts" style="font-size:9.5px">coordinates rule + LLM branches per deal</text>

  <!-- Fork -->
  <line x1="340" y1="230" x2="240" y2="260" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="480" y1="230" x2="580" y2="260" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="410" y="250" text-anchor="middle" class="ns" style="font-size:9px;letter-spacing:.1em;font-weight:600">PARALLEL</text>

  <!-- ═══ B: Rule Engine ═══ -->
  <rect class="card" x="40" y="264" width="370" height="152" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="58" y="284" class="h" style="font-size:11px;fill:#c96415">B</text>
  <text x="74" y="284" class="h" style="font-size:10px">DETERMINISTIC RULE ENGINE</text>
  <rect class="node" x="58" y="294" width="336" height="28" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".8"/>
  <text x="226" y="310" text-anchor="middle" class="nt">Compliance &amp; Readiness Checks</text>

  <rect class="node" x="58" y="330" width="162" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="139" y="346" text-anchor="middle" class="ns">Document completeness</text>
  <rect class="node" x="232" y="330" width="162" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="313" y="346" text-anchor="middle" class="ns">SLA &amp; deadline monitoring</text>
  <rect class="node" x="58" y="360" width="162" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="139" y="376" text-anchor="middle" class="ns">KYC &amp; accreditation</text>
  <rect class="node" x="232" y="360" width="162" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="313" y="376" text-anchor="middle" class="ns">Cross-doc field consistency</text>

  <rect x="130" y="392" width="100" height="18" rx="9" fill="#fff4eb" stroke="#e8a76e" stroke-width="1"/>
  <text x="180" y="404" text-anchor="middle" class="pill-t" fill="#c96415">Reproducible</text>
  <rect x="238" y="392" width="120" height="18" rx="9" fill="#fff4eb" stroke="#e8a76e" stroke-width="1"/>
  <text x="298" y="404" text-anchor="middle" class="pill-t" fill="#c96415">Evidence-based</text>

  <!-- ═══ C: LLM ═══ -->
  <rect class="card" x="430" y="264" width="350" height="152" rx="12" fill="#fff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="448" y="284" class="h" style="font-size:11px;fill:#1a6aaf">C</text>
  <text x="464" y="284" class="h" style="font-size:10px">LLM SEMANTIC REASONING</text>
  <rect class="node" x="448" y="294" width="316" height="28" rx="7" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".8"/>
  <text x="606" y="310" text-anchor="middle" class="nt">Contextual Risk Interpretation</text>

  <rect class="node" x="448" y="330" width="100" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="498" y="346" text-anchor="middle" class="ns">Risk summary</text>
  <rect class="node" x="556" y="330" width="100" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="606" y="346" text-anchor="middle" class="ns">Blocker extraction</text>
  <rect class="node" x="664" y="330" width="100" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="714" y="346" text-anchor="middle" class="ns">Next action</text>

  <rect class="node" x="448" y="362" width="316" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width=".6"/>
  <text x="606" y="378" text-anchor="middle" class="ns">Graceful fallback to rule-only output if LLM fails</text>

  <rect x="540" y="392" width="85" height="18" rx="9" fill="#e8f2fc" stroke="#7bb4de" stroke-width="1"/>
  <text x="582" y="404" text-anchor="middle" class="pill-t" fill="#1a6aaf">GPT-4o-mini</text>
  <rect x="633" y="392" width="70" height="18" rx="9" fill="#e8f2fc" stroke="#7bb4de" stroke-width="1"/>
  <text x="668" y="404" text-anchor="middle" class="pill-t" fill="#1a6aaf">Fallback</text>

  <!-- Merge -->
  <line x1="240" y1="416" x2="340" y2="442" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="580" y1="416" x2="480" y2="442" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ═══ D: Scoring ═══ -->
  <rect x="160" y="446" width="500" height="38" rx="10" fill="#0e7960"/>
  <text x="310" y="464" text-anchor="middle" class="t" style="font-size:12px">Dual Scoring</text>
  <text x="310" y="477" text-anchor="middle" class="ts" style="font-size:9px">risk severity · deal readiness</text>
  <text x="500" y="464" text-anchor="middle" class="t" style="font-size:12px">Audit Trail</text>
  <text x="500" y="477" text-anchor="middle" class="ts" style="font-size:9px">evidence · decision trace</text>

  <!-- Arrow -->
  <line x1="410" y1="484" x2="410" y2="500" stroke="#8b949e" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- ═══ E: Output ═══ -->
  <rect x="130" y="504" width="260" height="24" rx="8" fill="#24292f"/>
  <text x="260" y="520" text-anchor="middle" class="t" style="font-size:11px">Dashboard · pipeline overview · KPIs</text>
  <rect x="410" y="504" width="280" height="24" rx="8" fill="#24292f"/>
  <text x="550" y="520" text-anchor="middle" class="t" style="font-size:11px">Deal Analysis · per-deal risk &amp; actions</text>
</svg>
